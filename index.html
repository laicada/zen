<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEN</title>
<meta name="description" content="ZEN. Скоро.">
<meta property="og:title" content="ZEN">
<meta property="og:description" content="Скоро.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%230a0a0a' stroke='%23e5252a' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface-1:#0d0d0d;--surface-2:#141414;
  --border:#222;--border-strong:#2a2a2a;
  --text:#d0d0d0;--text-secondary:#b5b5b5;--text-muted:#8a8a8a;--text-faint:#666;
  --signal:#e5252a;
  --moon-0:#1a0505;--moon-1:#4a0d0d;--moon-2:#8b1a1a;--moon-3:#d11f26;--moon-4:#ff5a52;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;z-index:0}
.label{position:fixed;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom,0px));z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-align:center}
#t{font-size:clamp(18px,2.2vw,22px);font-weight:500;letter-spacing:.6em;margin-right:-.6em;color:var(--text)}
#s{font:600 14px "IBM Plex Mono",Consolas,Menlo,monospace;letter-spacing:.2em;margin-right:-.2em;color:var(--signal);animation:b 6s ease-in-out infinite;white-space:pre}
#k{font-size:11px;letter-spacing:.3em;margin-right:-.3em;color:var(--text-faint);text-transform:uppercase}
@keyframes b{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#s{animation:none}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Солнечное затмение из символов: тёмная луна с кратерами медленно закрывает красное солнце, вспыхивает корона. Клик разбрасывает корону буквами, и она вырастает снова"></canvas>
<div class="label"><div id="t">ZEN</div><div id="s" role="timer" aria-label="Таймер закрыт">██ : ██ : ██ : ██</div><div id="k">скоро</div></div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var TAU=Math.PI*2;
var RAMP=' .·:-=+*#%@',MESSAGE='ZEN ',LETTERS=['Z','E','N'],TYPED='eclipse()',GLITCH='01<>{}[]#$%&*+=?!ABXZ';
var CYCLE=26,T0=2.6;

var STOPS=[[26,5,5],[74,13,13],[139,26,26],[209,31,38],[255,90,82]];
var LUT=[];
for(var i=0;i<32;i++){var f=i/31*4,k=Math.min(3,Math.floor(f)),u=f-k,A=STOPS[k],B=STOPS[k+1];
  LUT.push('rgb('+Math.round(A[0]+(B[0]-A[0])*u)+','+Math.round(A[1]+(B[1]-A[1])*u)+','+Math.round(A[2]+(B[2]-A[2])*u)+')')}
function lc(b){return LUT[Math.max(0,Math.min(31,(b*32)|0))]}
var GL_A='rgb(208,208,208)',GL_B='rgb(138,138,138)';

function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mul(7);
function ss(a,b,x){var k=Math.max(0,Math.min(1,(x-a)/(b-a)));return k*k*(3-2*k)}

var HQ=(location.search.match(/[?&]h=(\d+(?:\.\d+)?)/)||[])[1],dayK=-1;
function dayTarget(){var d=new Date(),h=HQ!=null?+HQ:d.getHours()+d.getMinutes()/60;return ss(5,7.5,h)*(1-ss(18.5,21,h))}

var tEl=document.getElementById('s'),GG='01<>{}[]#$%&*+=?!';
if(!reduce)setInterval(function(){
  var o=[];for(var q=0;q<4;q++){var s='';for(var k=0;k<2;k++)s+=Math.random()<.07?GG[(Math.random()*GG.length)|0]:'█';o.push(s)}
  tEl.textContent=o.join(' : ');
},140);

var BM={Z:['11111','00001','00010','00100','01000','10000','11111'],E:['11111','10000','10000','11110','10000','10000','11111'],N:['10001','11001','10101','10101','10011','10001','10001']};
var word=null,WT=6.4,keybuf='',taps=[];
function startWord(){
  if(word||reduce)return;
  var sy=Math.max(1,Math.min(4,Math.floor((NC-4)/34))),sx=sy*2,c0=Math.floor((NC-17*sx)/2),r0=Math.floor(cy/ch-3.5*sy),ps=[];
  'ZEN'.split('').forEach(function(L,li){BM[L].forEach(function(row,ry){for(var rx=0;rx<5;rx++){if(row[rx]!=='1')continue;
    for(var a=0;a<sx;a++)for(var b=0;b<sy;b++){var an=Math.random()*TAU,rd=.5+Math.random()*.4;
      ps.push({tx:c0+(li*6+rx)*sx+a,ty:r0+ry*sy+b,l:L,dl:Math.random()*.9,
        x0:NC/2+Math.cos(an)*NC*rd,y0:NR/2+Math.sin(an)*NR*rd,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*8})}}})});
  word={t0:performance.now(),ps:ps};
}
addEventListener('keydown',function(e){keybuf=(keybuf+(e.key||'').toLowerCase()).slice(-3);if(keybuf==='zen'||keybuf==='яут')startWord()});
addEventListener('pointerdown',function(){var n=performance.now();taps=taps.filter(function(x){return n-x<700});taps.push(n);if(taps.length>=3){taps=[];startWord()}});

var NCR=30,CRX=[],CRY=[],CRZ=[],CRC=[];
for(var n=0;n<NCR;n++){
  var z=rnd()*2-1,a=rnd()*TAU,rr=Math.sqrt(1-z*z);
  CRX.push(rr*Math.cos(a));CRY.push(rr*Math.sin(a));CRZ.push(z);
  CRC.push(Math.cos(.07+Math.pow(rnd(),2)*.3));
}
var PA=[.6,2.5,4.4];

var W,H,dpr,g,cw,ch,NC,NR,cx,cy,R,X,Y,D,AN,HS,firstOn,SETTLE,fontStr;
var sm1=document.createElement('canvas'),sm2=document.createElement('canvas');
var dust=[],wb=0,dl=0,parts=[];
function setup(){
  W=innerWidth;H=innerHeight;
  var fq=Math.min(.62*H/760,.9*W/960);
  dpr=Math.min(devicePixelRatio||1,1.5);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  g=Math.max(.75,Math.min(1.6,fq));cw=6*g;ch=12*g;
  NC=Math.floor(W/cw);NR=Math.floor(H/ch);
  cx=W/2;cy=H*.44;R=Math.min(W*.3,H*.2);
  var n=NC*NR;X=new Float32Array(n);Y=new Float32Array(n);D=new Float32Array(n);AN=new Float32Array(n);HS=new Float32Array(n);
  firstOn=new Float32Array(n).fill(Infinity);SETTLE=new Float32Array(n);
  for(var r=0;r<NR;r++)for(var c=0;c<NC;c++){
    var i=r*NC+c,x=((c+.5)*cw-cx)/R,y=((r+.5)*ch-cy)/R;
    X[i]=x;Y[i]=y;D[i]=Math.sqrt(x*x+y*y);AN[i]=Math.atan2(y,x);
    var s=Math.sin(c*127.1+r*311.7)*43758.5453;HS[i]=s-Math.floor(s);
    SETTLE[i]=.12+rnd()*.5;
  }
  fontStr='600 '+(10*g)+'px "IBM Plex Mono",Consolas,Menlo,monospace';
  sm1.width=Math.max(1,cv.width/5|0);sm1.height=Math.max(1,cv.height/5|0);
  sm2.width=Math.max(1,cv.width/18|0);sm2.height=Math.max(1,cv.height/18|0);
  initDust();
}
setup();addEventListener('resize',function(){setup();if(reduce)frame(performance.now())});

function initDust(){
  var n=Math.min(260,Math.round(W*H/8500));dust=[];
  for(var i=0;i<n;i++)dust.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.012,vy:-.004-Math.random()*.014,s:.6+Math.random()*.9,a:.1+Math.random()*.35,ph:Math.random()*6.28,sp:.6+Math.random()*1.8,d:.3+Math.random()*.7,r:Math.random()<.12});
}
function drawDust(boost,now){
  var ts=now/1000,dt=Math.min(.1,(ts-dl)||.03);dl=ts;
  wb+=((boost?.3:0)-wb)*Math.min(1,dt*1.5);
  var cf='';
  for(var i=0;i<dust.length;i++){
    var p=dust[i];
    p.x+=(p.vx+wb*p.d)*dt;p.y+=(p.vy-wb*.35*p.d)*dt;
    if(p.x>1.02)p.x-=1.04;else if(p.x<-.02)p.x+=1.04;
    if(p.y<-.02)p.y+=1.04;else if(p.y>1.02)p.y-=1.04;
    ctx.globalAlpha=p.a*(.55+.45*Math.sin(ts*p.sp+p.ph));
    var cc=p.r?'#d11f26':'#d0d0d0';if(cc!==cf){ctx.fillStyle=cc;cf=cc}ctx.fillRect(p.x*W,p.y*H,p.s,p.s);
  }
  ctx.globalAlpha=1;
}
function bloom(sm,amt){
  var s=sm.getContext('2d');s.imageSmoothingEnabled=true;s.imageSmoothingQuality='high';s.clearRect(0,0,sm.width,sm.height);s.drawImage(cv,0,0,sm.width,sm.height);
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=amt;ctx.imageSmoothingEnabled=true;ctx.drawImage(sm,0,0,cv.width,cv.height);ctx.restore();
}

var start=performance.now(),clickAt=-1,lastNow=0;
function spawn(){
  for(var i=0;i<520;i++){
    var a=Math.random()*TAU,rad=1+Math.random()*1.4,sp=.5+Math.random()*2.3;
    parts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,life:1.5+Math.random()*1.9,b:.45+Math.random()*.55,l:LETTERS[(Math.random()*3)|0]});
  }
}
addEventListener('pointerdown',function(){
  var now=performance.now();
  if(reduce){clickAt=now;spawn();frame(now);return}
  if(clickAt<0&&(now-start)/1000>2){clickAt=now;spawn()}
});

var cur='';
function put(chr,c,r,style){
  if(chr===' ')return;
  if(style!==cur){ctx.fillStyle=style;cur=style}
  ctx.fillText(chr,c*cw,r*ch);
}
function frame(now){
  var t=reduce?(T0+CYCLE*.5):(now-start)/1000;
  var dtp=Math.min(.1,(now-lastNow)/1000||.03);lastNow=now;
  if(dayK<0||reduce)dayK=dayTarget();else dayK+=(dayTarget()-dayK)*Math.min(1,dtp*.6);
  var mx=-4*dayK,my=.1*dayK,rm=1.03;
  var ct=-1;
  if(clickAt>=0){ct=(now-clickAt)/1000;if(ct>4.4){clickAt=-1;ct=-1}}
  if(ct>=0){var qq=Math.exp(-ct*2.2);mx+=Math.sin(ct*38)*.025*qq;my+=Math.cos(ct*31)*.02*qq}
  var sep=Math.sqrt(mx*mx+my*my)+1e-6,ux=-mx/sep,uy=-my/sep;
  var cover=1-ss(0,1.6,sep);
  var sc=reduce?1:ss(.9,2.6,t),rs=sc*(1+.025*Math.sin(t*2.6)*ss(2.6,3.4,t));
  var intro=reduce?1:ss(1.6,3.8,t);
  var bump=ct>=0?ss(0,.25,ct)*(1-ss(.7,3.2,ct)):0;
  var cmul=intro*(1-.8*bump),flare=ct>=0?Math.max(0,1-ct/.7):0;
  var beadAmp=ss(.02,.09,sep)*(1-ss(.3,.8,sep))*1.4,bx=ux*rs*.97,by=uy*rs*.97;
  var yaw=t*.05,cyw=Math.cos(yaw),syw=Math.sin(yaw);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  var gr=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.55);
  gr.addColorStop(0,'rgba(139,26,26,'+(.05+.12*cover*intro)+')');gr.addColorStop(1,'rgba(10,10,10,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  drawDust(ct>=0,now);
  ctx.font=fontStr;ctx.textBaseline='top';cur='';

  for(var r=0;r<NR;r++){
    for(var c=0;c<NC;c++){
      var i=r*NC+c,x=X[i],y=Y[i],d=D[i],chr=' ',b=0,col=null;
      var dmx=x-mx,dmy=y-my,dm=Math.sqrt(dmx*dmx+dmy*dmy);

      if(dm<rm){
        var nx=dmx/rm,ny=dmy/rm,nzz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
        var p3x=nx*cyw+nzz*syw,p3z=-nx*syw+nzz*cyw,tex=0;
        for(var k=0;k<NCR;k++){
          var dot=p3x*CRX[k]+ny*CRY[k]+p3z*CRZ[k];
          if(dot>CRC[k]){
            var ff=(1-dot)/(1-CRC[k]);
            if(ff<.75)tex-=.5*(1-ff/.75);else tex+=.55*Math.sin(Math.PI*(ff-.75)/.25);
          }
        }
        tex+=-.22*(.5+.5*Math.sin(p3x*3+1)*Math.sin(ny*2.5+p3z*2));
        var base=.13+.17*Math.max(0,-.45*nx-.55*ny+.7*nzz);
        var fr=Math.pow(1-nzz,2.4),fac=Math.max(0,nx*ux+ny*uy);
        var rim=fr*(.3+.9*cover)*(.4+.6*fac)*1.25*intro;
        b=base*(1+tex)+rim+.22*flare*fr;
        b=Math.max(.11,Math.min(.999,b));
        chr=RAMP[(b*10)|0];col=lc(b);
      }else if(d<rs){
        var u=d/rs,nzs=Math.sqrt(Math.max(0,1-u*u));
        b=.4+.5*Math.pow(nzs,.7);
        b*=.93+.07*Math.sin(x*16+t*.7+Math.sin(y*11+t*.5)*1.6)*Math.sin(y*14-t*.6+Math.sin(x*9)*1.4);
        var dbx=x-bx,dby=y-by;
        b+=beadAmp*Math.exp(-(dbx*dbx+dby*dby)/.05)*.9+flare*.3;
        b=Math.min(.999,b);
        chr=RAMP[(b*10)|0];if(b>.86)chr=MESSAGE[i%4];col=lc(b);
      }else if(d<3.6){
        var e=d-rs,a=AN[i];
        var streak=1+.35*Math.sin(a*5+t*.15)+.22*Math.sin(a*11-t*.1)+.15*Math.sin(a*23+t*.07);
        var gl=Math.exp(-e/.45)*streak;
        var sa=Math.sin(a*3+1.2+t*.03);if(sa>0){sa*=sa;gl+=.65*sa*sa*sa*cover*Math.exp(-e/1.5)}
        var sb=Math.sin(a*2-.7-t*.04);if(sb>0){sb*=sb;gl+=.5*sb*sb*sb*cover*Math.exp(-e/1.9)}
        gl*=(.2+.8*cover)*.95;
        if(cover>.4&&e<.3){
          for(var q=0;q<3;q++){
            var da=a-PA[q];da-=TAU*Math.round(da/TAU);
            var ee=(e-.07-.05*Math.sin(t*.5+q))/.06;
            gl+=.8*cover*Math.exp(-da*da/.0049-ee*ee);
          }
        }
        gl*=cmul*(.92+.08*Math.sin(c*.9+r*1.3+t*2.4));
        var dbx2=x-bx,dby2=y-by;
        gl+=beadAmp*Math.exp(-(dbx2*dbx2+dby2*dby2)/.09)*.8*intro;
        if(ct>=0){
          var wv=(e-ct*1.7)/.18,w=Math.exp(-wv*wv)*Math.max(0,1-ct/3.4);
          gl+=.75*w+.55*flare*Math.exp(-e/1.1);
          if(w>.3&&Math.random()<.2){chr='·:+*#'[(Math.random()*5)|0];col=lc(Math.min(.999,gl))}
        }
        b=Math.min(.999,gl);
        var idx=(b*10)|0;
        if(chr===' '&&idx>=1){chr=RAMP[idx];col=lc(b)}
        else if(chr===' '){
          var h=HS[i];
          if(h>.986){var tw=.55+.45*Math.sin(t*(.6+h*3)+h*90);chr=h>.996?'*':'·';col=lc((.22+.3*cover)*tw*intro);b=.2}
        }
      }else{
        var h2=HS[i];
        if(h2>.986){var tw2=.55+.45*Math.sin(t*(.6+h2*3)+h2*90);chr=h2>.996?'*':'·';col=lc((.22+.3*cover)*tw2*intro);b=.2}
      }
      if(chr===' '||!col){firstOn[i]=Infinity;continue}
      if(t<6){
        if(firstOn[i]===Infinity)firstOn[i]=t;
        if(t-firstOn[i]<SETTLE[i]){chr=GLITCH[(Math.random()*GLITCH.length)|0];col=Math.random()<.5?GL_A:GL_B}
      }
      put(chr,c,r,col);
    }
  }

  for(var pi=parts.length-1;pi>=0;pi--){
    var pt=parts[pi];pt.age+=dtp;
    if(pt.age>=pt.life){parts.splice(pi,1);continue}
    pt.vx+=.9*dtp;pt.x+=pt.vx*dtp;pt.y+=pt.vy*dtp;
    var pc=Math.floor((cx+pt.x*R)/cw),pr=Math.floor((cy+pt.y*R)/ch);
    if(pc<0||pc>=NC||pr<0||pr>=NR)continue;
    var fb=pt.b*(1-pt.age/pt.life);
    put(pt.age<.2?GLITCH[(Math.random()*GLITCH.length)|0]:pt.l,pc,pr,lc(Math.min(.999,fb*1.2)));
  }

  if(word){
    var wt=(now-word.t0)/1000;
    if(wt>WT)word=null;
    else{
      ctx.fillStyle='rgba(10,10,10,'+(.62*ss(0,.8,wt)*(1-ss(WT-1.4,WT,wt)))+')';ctx.fillRect(0,0,W,H);cur='';
      var fade=1-ss(4.4,WT,wt),rl=Math.max(0,wt-4.4);
      for(var wi=0;wi<word.ps.length;wi++){
        var q2=word.ps[wi],k2=Math.max(0,Math.min(1,(wt-q2.dl)/1.7));k2=1-Math.pow(1-k2,3);
        var wx=q2.x0+(q2.tx-q2.x0)*k2+q2.vx*rl*rl,wy=q2.y0+(q2.ty-q2.y0)*k2+q2.vy*rl*rl;
        if(wx<0||wx>=NC||wy<0||wy>=NR)continue;
        var moving=k2<.96||Math.random()<.02;
        put(moving?GLITCH[(Math.random()*GLITCH.length)|0]:q2.l,wx|0,wy|0,lc(Math.min(.999,(.45+.55*k2)*fade)));
      }
    }
  }

  if(!reduce){
    var row=Math.floor(cy/ch),blink=(t*2.2)%1<.55,c0=(NC>>1)-(TYPED.length>>1),ii;
    if(t<.3){if(blink)put('_',NC>>1,row,GL_A)}
    else if(t<.85){var nn=Math.floor((t-.3)/.55*TYPED.length)+1,str=TYPED.slice(0,nn)+'_';for(ii=0;ii<str.length;ii++)put(str[ii],c0+ii,row,GL_A)}
    else if(t<1.3){var f2=1-(t-.85)/.45;for(ii=0;ii<TYPED.length;ii++){var c2=TYPED[ii];if(Math.random()<.6)c2=GLITCH[(Math.random()*GLITCH.length)|0];if(Math.random()<f2){var vv=Math.floor(220*f2);put(c2,c0+ii,row,'rgb('+vv+','+vv+','+vv+')')}}}
  }
  bloom(sm1,.38);bloom(sm2,.42);
}

function run(){
  if(reduce){frame(performance.now());return}
  start=performance.now();var lastDraw=0;
  requestAnimationFrame(function loop(now){
    requestAnimationFrame(loop);
    if(now-lastDraw<33)return;lastDraw=now;frame(now);
  });
}
Promise.race([document.fonts?document.fonts.load('600 12px "IBM Plex Mono"'):0,new Promise(function(r){setTimeout(r,1200)})]).then(run,run);
})();
</script>
</body>
</html>
